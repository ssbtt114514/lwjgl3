name: Build LWJGL 3.3.3 Modules (shaderc, vma, vulkan)

on:
  push:
    branches: [ main, master, wip/rebase_3.3.3 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x64
          - x86

jobs:
  build-modules:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ant cmake ninja-build

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        link-to-sdk: true

    - name: Build LWJGL 3.3.3 Android
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        LWJGL_BUILD_ARCH: ${{ github.event.inputs.target_arch || 'arm64' }}
        JAVA8_HOME: ${{ env.JAVA_HOME }}
      run: |
        echo "Building for architecture: $LWJGL_BUILD_ARCH"
        chmod +x ci_build_android.bash
        bash ci_build_android.bash

    - name: Collect specific modules
      run: |
        mkdir -p output/modules
        ARCH=${{ github.event.inputs.target_arch || 'arm64' }}
        
        # 查找并复制目标模块
        find bin/RELEASE -name "lwjgl-shaderc*.jar" -exec cp {} output/modules/ \;
        find bin/RELEASE -name "lwjgl-vma*.jar" -exec cp {} output/modules/ \;
        find bin/RELEASE -name "lwjgl-vulkan*.jar" -exec cp {} output/modules/ \;
        
        # 复制原生库
        mkdir -p output/natives
        find bin/out -name "*shaderc*" -exec cp {} output/natives/ \;
        find bin/out -name "*vma*" -exec cp {} output/natives/ \;
        find bin/out -name "*vulkan*" -exec cp {} output/natives/ \;
        
        echo "=== 编译完成的模块 ==="
        ls -la output/modules/
        echo "=== 原生库 ==="
        ls -la output/natives/

    - name: Upload modules artifact
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl-3.3.3-modules-${{ github.event.inputs.target_arch || 'arm64' }}
        path: |
          output/modules/
          output/natives/
        retention-days: 90

    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: lwjgl-3.3.3-${{ github.event.inputs.target_arch || 'arm64' }}-${{ github.run_number }}
        name: LWJGL 3.3.3 Modules (${{ github.event.inputs.target_arch || 'arm64' }})
        body: |
          自动编译的 LWJGL 3.3.3 模块
          
          **包含模块：**
          - lwjgl-shaderc.jar
          - lwjgl-vma.jar (Vulkan Memory Allocator)
          - lwjgl-vulkan.jar
          
          **目标架构：** ${{ github.event.inputs.target_arch || 'arm64' }}
          **编译时间：** ${{ github.event.head_commit.timestamp }}
        files: |
          output/modules/*.jar
          output/natives/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
