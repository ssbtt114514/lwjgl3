name: Build LWJGL 3.3.3 Android (shaderc, vma, vulkan)

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - x64
          - x86
  push:
    branches: [ wip/rebase_3.3.3 ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix build.gradle.kts - Enable Vulkan for all platforms
        run: |
          # 将 VULKAN 的平台支持从 macOS 改为所有平台
          sed -i 's/Platforms.MACOS, Platforms.MACOS_ARM64/*Platforms.ALL/' build.gradle.kts
          echo "=== 验证修改 ==="
          grep -A 4 "VULKAN(" build.gradle.kts

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ant cmake ninja-build build-essential

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          link-to-sdk: true

      - name: Build LWJGL 3.3.3 Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LWJGL_BUILD_ARCH: ${{ github.event.inputs.target_arch || 'arm64' }}
          JAVA8_HOME: ${{ env.JAVA_HOME }}
        run: |
          echo "========================================"
          echo "Building LWJGL 3.3.3 for Android"
          echo "Architecture: $LWJGL_BUILD_ARCH"
          echo "JAVA8_HOME: $JAVA8_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "========================================"
          
          java -version
          
          # 确保脚本可执行
          chmod +x ci_build_android.bash
          
          # 执行编译
          bash ci_build_android.bash 2>&1 | tee build.log

      - name: Check and collect artifacts
        run: |
          echo "=== 检查 bin/RELEASE 内容 ==="
          ls -la bin/RELEASE/ 2>/dev/null || echo "目录不存在"
          
          echo ""
          echo "=== 查找目标模块 ==="
          mkdir -p output/modules output/natives
          
          # 查找 shaderc
          echo "Looking for shaderc..."
          find bin/RELEASE -name "*shaderc*" -type f 2>/dev/null | while read f; do
            echo "Found: $f"
            cp "$f" output/modules/
          done
          
          # 查找 vma
          echo "Looking for vma..."
          find bin/RELEASE -name "*vma*" -type f 2>/dev/null | while read f; do
            echo "Found: $f"
            cp "$f" output/modules/
          done
          
          # 查找 vulkan
          echo "Looking for vulkan..."
          find bin/RELEASE -name "*vulkan*" -type f 2>/dev/null | while read f; do
            echo "Found: $f"
            cp "$f" output/modules/
          done
          
          # 复制所有 lwjgl jar 文件
          find bin/RELEASE -name "lwjgl*.jar" -exec cp {} output/modules/ \; 2>/dev/null || true
          
          # 复制原生库
          if [ -d "bin/out" ]; then
            echo "=== 复制原生库 ==="
            cp bin/out/* output/natives/ 2>/dev/null || true
          fi
          
          echo ""
          echo "=== 最终输出 ==="
          echo "Modules:"
          ls -la output/modules/ || echo "无模块"
          echo ""
          echo "Natives:"
          ls -la output/natives/ || echo "无原生库"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.target_arch || 'arm64' }}
          path: build.log
          retention-days: 7

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-modules-${{ github.event.inputs.target_arch || 'arm64' }}
          path: output/modules/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-natives-${{ github.event.inputs.target_arch || 'arm64' }}
          path: output/natives/
          retention-days: 90
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: lwjgl-3.3.3-${{ github.event.inputs.target_arch || 'arm64' }}-${{ github.run_number }}
          name: LWJGL 3.3.3 Android ${{ github.event.inputs.target_arch || 'arm64' }} (shaderc, vma, vulkan)
          body: |
            ## LWJGL 3.3.3 Android 构建
            
            **架构:** ${{ github.event.inputs.target_arch || 'arm64' }}
            **版本:** 3.3.3
            **包含模块:**
            - lwjgl-shaderc (着色器编译器)
            - lwjgl-vma (Vulkan Memory Allocator)
            - lwjgl-vulkan (Vulkan 绑定)
            - lwjgl-core, lwjgl-glfw, lwjgl-opengl, lwjgl-openal, lwjgl-stb 等核心模块
            
            **文件说明:**
            - `lwjgl-modules-*.zip` - Java JAR 文件
            - `lwjgl-natives-*.zip` - Android 原生 SO 库
          files: |
            output/modules/*.jar
            output/natives/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
