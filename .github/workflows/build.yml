name: Build LWJGL3 Android

on:
  push:
    branches: [ main, master, wip/rebase_3.3.3 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, arm32, x64, x86]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Install Ant
      run: sudo apt-get update && sudo apt-get install -y ant

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: r25c  # 可根据需要调整版本

    - name: Build Android ${{ matrix.arch }}
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        LWJGL_BUILD_ARCH: ${{ matrix.arch }}
        JAVA8_HOME: ${{ env.JAVA_HOME }}
      run: |
        chmod +x ci_build_android.bash
        bash ci_build_android.bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lwjgl3-android-${{ matrix.arch }}
        path: |
          bin/RELEASE/
          bin/out/
        retention-days: 30
